<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Buscador</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Google Fonts (opcional) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>"
    />
  </head>
  <body>
    <div class="container py-4 py-md-5">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <!-- Header -->
          <div
            class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4"
          >
            <div class="d-flex align-items-center gap-3">
              <div class="bg-primary bg-opacity-10 p-3 rounded-3">
                <i class="bi bi-tools fs-1 text-primary"></i>
              </div>
              <div>
                <h1 class="h3 fw-bold mb-0">Buscador</h1>
                <span
                  class="badge bg-primary bg-opacity-10 text-primary fw-normal mt-1"
                  id="modeloBadge"
                >
                  <i class="bi bi-car-front me-1"></i> Cargando...
                </span>
              </div>
            </div>
          </div>

          <!-- Buscador -->
          <div class="mb-4">
            <div class="input-group input-group-lg shadow-sm">
              <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-search text-secondary"></i>
              </span>
              <input
                type="text"
                id="buscador"
                class="form-control border-start-0 ps-0"
                placeholder="Buscar válvula, menú o submenú..."
                autofocus
                autocomplete="off"
              />
              <button
                id="limpiarBtn"
                class="btn btn-outline-secondary border-start-0"
                type="button"
                style="display: none"
              >
                <i class="bi bi-x-lg"></i>
              </button>
            </div>
            <div class="mt-2"></div>
          </div>

          <!-- Estadísticas -->
          <div
            id="estadisticas"
            class="alert alert-secondary py-2 px-3 mb-3"
            style="display: none"
          >
            <small>
              <i class="bi bi-bar-chart me-1"></i>
              <span id="estadisticasTexto"></span>
            </small>
          </div>

          <!-- Resultados -->
          <div id="resultados" style="min-height: 200px">
            <!-- Estado vacío (se carga con JS) -->
          </div>

          <!-- Footer -->
          <hr class="my-3" />
          <!-- <div
            class="d-flex flex-wrap justify-content-between align-items-center text-muted small"
          >
            <span
              ><i class="bi bi-database me-1"></i>
              <span id="footerModelo">Cadillac ATS 2015</span></span
            >
            <span
              ><i class="bi bi-clock me-1"></i> Búsqueda en tiempo real</span
            >
            <span
              ><i class="bi bi-calendar me-1"></i> <span id="fechaActual"></span
            ></span>
          </div> -->
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/script.js"></script>
  </body>
</html>
